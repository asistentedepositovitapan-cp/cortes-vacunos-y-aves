<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Control de Productos Cárnicos y Pollos</title>
<meta name="theme-color" content="#7A2E2E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#241B17;
    --paper:#FAF7F2;
    --paper-dim:#EFEAE1;
    --burgundy:#7A2E2E;
    --burgundy-dark:#5E2222;
    --mustard:#C99A3C;
    --mustard-dark:#A17B27;
    --info:#3E6B7A;
    --line:#DCD3C4;
    --muted:#8A7F73;
    --good:#3E7A52;
    --bad:#B24C3A;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{
    background:var(--ink);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .shell{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
  }
  header.top{
    background:var(--ink);
    color:var(--paper);
    padding:22px 20px 18px;
    position:relative;
  }
  header.top .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--mustard);
    margin:0 0 4px;
  }
  header.top h1{
    font-family:'Bitter',serif;
    font-weight:800;
    font-size:22px;
    line-height:1.15;
    margin:0;
    letter-spacing:-0.01em;
  }
  .install-btn{
    margin-top:14px;
    border:1px solid var(--mustard);
    background:rgba(201,154,60,0.14);
    color:var(--mustard);
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:13px;
    padding:9px 14px;
    border-radius:100px;
    cursor:pointer;
  }
  .install-btn:active{ transform:scale(0.97); }

  nav.tabs{
    display:flex;
    background:var(--ink);
    padding:0 20px;
    gap:6px;
  }
  nav.tabs button{
    flex:1;
    border:none;
    padding:12px 10px 14px;
    font-family:'Bitter',serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    border-radius:10px 10px 0 0;
    background:rgba(250,247,242,0.06);
    color:rgba(250,247,242,0.55);
    transition:background .15s, color .15s;
  }
  nav.tabs button.active.vacuno{ background:var(--paper); color:var(--burgundy); }
  nav.tabs button.active.pollo{ background:var(--paper); color:var(--mustard-dark); }

  main{ flex:1; padding:18px 18px 100px; }

  .scale-panel{
    background:var(--ink);
    border-radius:14px;
    padding:18px 18px 16px;
    color:var(--paper);
    position:relative;
    overflow:hidden;
  }
  .scale-panel::before{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(135deg, rgba(122,46,46,0.35), rgba(201,154,60,0.12));
    pointer-events:none;
  }
  .scale-panel.pollo::before{
    background:linear-gradient(135deg, rgba(201,154,60,0.35), rgba(122,46,46,0.10));
  }
  .scale-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:rgba(250,247,242,0.55);
    margin:0 0 6px;
    position:relative;
  }
  .scale-readout{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:40px;
    line-height:1;
    color:var(--mustard);
    display:flex;
    align-items:baseline;
    gap:8px;
    position:relative;
  }
  .vacuno .scale-readout{ color:#E3A6A6; }
  .scale-readout small{ font-size:16px; font-weight:600; color:rgba(250,247,242,0.6);}

  .corte-stock-list{
    margin-top:14px;
    display:flex;
    flex-direction:column;
    gap:6px;
    position:relative;
  }
  .corte-stock-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(250,247,242,0.08);
    border-radius:8px;
    padding:8px 12px;
    font-size:13px;
  }
  .corte-stock-row .kg{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
  }

  .actions-row{
    display:flex;
    gap:10px;
    margin-top:16px;
    position:relative;
  }
  .btn{
    flex:1;
    border:none;
    border-radius:10px;
    padding:13px 10px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    text-align:center;
  }
  .btn-entrada{ background:var(--good); color:#fff; }
  .btn-despiece{ background:var(--info); color:#fff; }
  .btn-salida{ background:var(--burgundy); color:#fff; }
  .tabpanel.pollo .btn-salida{ background:var(--mustard-dark); }
  .btn-reporte{ background:rgba(250,247,242,0.12); color:var(--paper); border:1px solid rgba(250,247,242,0.25); }
  .btn:active{ transform:scale(0.98); }

  .raw-stock-box{
    margin-top:18px;
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .raw-stock-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .raw-stock-row:last-child{ border-bottom:none; }
  .raw-stock-row .name{ font-weight:600; }
  .raw-stock-row .detail{ color:var(--muted); font-size:11.5px; }
  .raw-stock-row .kg{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    text-align:right;
  }

  .section-title{
    font-family:'Bitter',serif;
    font-weight:700;
    font-size:15px;
    margin:26px 0 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .section-title .link-btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12px;
    color:var(--burgundy);
    background:none;
    border:none;
    cursor:pointer;
    text-decoration:underline;
  }
  .tabpanel.pollo .section-title .link-btn{ color:var(--mustard-dark); }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    background:var(--paper-dim);
    border:1px solid var(--line);
    padding:6px 10px;
    border-radius:100px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .chip button{
    border:none; background:none; cursor:pointer;
    color:var(--muted); font-size:13px; line-height:1; padding:0;
  }

  .filter-row{ display:flex; gap:8px; margin-bottom:12px; }
  .filter-btn{
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--muted);
    font-size:12px;
    font-weight:600;
    padding:6px 12px;
    border-radius:100px;
    cursor:pointer;
  }
  .filter-btn.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }

  .ticket{
    background:var(--paper);
    border:1px dashed var(--line);
    border-radius:8px;
    padding:12px 14px;
    margin-bottom:10px;
    position:relative;
  }
  .ticket .row1{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .ticket .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.08em;
    padding:2px 7px;
    border-radius:4px;
    font-weight:700;
    white-space:nowrap;
  }
  .tag.recepcion{ background:rgba(62,122,82,0.15); color:var(--good); }
  .tag.despiece{ background:rgba(62,107,122,0.15); color:var(--info); }
  .tag.remito{ background:rgba(122,46,46,0.12); color:var(--burgundy); }
  .tabpanel.pollo .tag.remito{ background:rgba(201,154,60,0.18); color:var(--mustard-dark); }
  .ticket .kg{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:16px;
    white-space:nowrap;
  }
  .ticket .meta{
    margin-top:5px;
    font-size:12.5px;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
    gap:8px;
    flex-wrap:wrap;
  }
  .ticket .lines{
    margin-top:6px;
    font-size:12.5px;
    color:var(--ink);
  }
  .ticket .lines .line-item{ display:flex; justify-content:space-between; padding:2px 0; }
  .ticket .corte-name{ font-weight:600; color:var(--ink); }
  .ticket .del{
    border:none; background:none; color:var(--muted); font-size:12px;
    cursor:pointer; text-decoration:underline; padding:0;
  }
  .ticket .pdf-link{
    border:none; background:none; color:var(--info); font-size:12px;
    cursor:pointer; text-decoration:underline; padding:0; font-weight:600;
  }
  .empty{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:26px 10px;
    border:1px dashed var(--line);
    border-radius:10px;
  }

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(36,27,23,0.55);
    display:none; align-items:flex-end; justify-content:center; z-index:50;
    overflow-y:auto;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:var(--paper);
    width:100%; max-width:560px;
    border-radius:18px 18px 0 0;
    padding:20px 20px 26px;
    animation:slideup .18s ease-out;
    margin-top:auto;
  }
  @keyframes slideup{ from{ transform:translateY(30px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .modal h2{
    font-family:'Bitter',serif;
    font-size:18px;
    margin:0 0 14px;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    margin-bottom:5px;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .field input, .field select, .field textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:8px;
    padding:11px 12px;
    font-family:'Inter',sans-serif;
    font-size:15px;
    background:#fff;
    color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--burgundy);
    outline-offset:1px;
  }
  .modal-actions{ display:flex; gap:10px; margin-top:6px; }
  .modal-actions .btn-secondary{
    flex:1; background:var(--paper-dim); color:var(--ink);
    border:1px solid var(--line); border-radius:10px; padding:13px; font-weight:700; cursor:pointer;
    font-size:13.5px;
  }
  .modal-actions .btn-primary{
    flex:1.4; border:none; border-radius:10px; padding:13px; font-weight:700; color:#fff; cursor:pointer;
    background:var(--burgundy);
  }
  .add-corte-inline{ display:flex; gap:8px; margin-top:8px; }
  .add-corte-inline input{ flex:1; }
  .add-corte-inline button{
    border:none; border-radius:8px; padding:0 14px; font-weight:700; color:#fff; background:var(--ink); cursor:pointer;
  }

  .corte-line{
    display:flex;
    gap:8px;
    margin-bottom:10px;
    align-items:center;
  }
  .corte-line select{ flex:1.6; }
  .corte-line input{ flex:1; }
  .corte-line .rm-line{
    border:none; background:var(--paper-dim); border-radius:8px; width:38px; height:38px;
    color:var(--muted); font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .add-line-btn{
    border:1px dashed var(--line);
    background:none;
    color:var(--muted);
    font-weight:600;
    font-size:13px;
    padding:9px;
    border-radius:8px;
    width:100%;
    cursor:pointer;
    margin-bottom:14px;
  }
  .lote-hint{
    font-size:12px;
    color:var(--muted);
    margin:-6px 0 14px;
  }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:11px 18px; border-radius:100px;
    font-size:13px; font-weight:600; z-index:99; opacity:0; pointer-events:none;
    transition:opacity .2s;
  }
  .toast.show{ opacity:1; }

  .config-banner{
    background:#3A2A20; color:#F4D8A8; font-family:'IBM Plex Mono',monospace;
    font-size:12px; padding:10px 16px; text-align:center; display:none;
  }
  .config-banner.show{ display:block; }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>

<div class="config-banner" id="configBanner">
  ⚠ Falta configurar Firebase — editá firebaseConfig en index.html
</div>

<div class="shell">
  <header class="top">
    <p class="eyebrow">Depósito · Control de mercadería</p>
    <h1>Control de Productos<br>Cárnicos y Pollos</h1>
    <button id="installBtn" class="install-btn" style="display:none;" onclick="triggerInstall()">⬇ Instalar app</button>
  </header>

  <nav class="tabs">
    <button class="active vacuno" data-tab="vacuno" onclick="setTab('vacuno')">🥩 Vacuno</button>
    <button class="pollo" data-tab="pollo" onclick="setTab('pollo')">🍗 Pollo</button>
  </nav>

  <main id="main">
    <!-- rendered by JS -->
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalContent"></div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase (compat SDK, vanilla JS) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<!-- jsPDF (generación de reportes y remitos en PDF) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<script>
/* =========================================================
   1) CONFIGURACIÓN DE FIREBASE
========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyCUEQMqmakCs6zGMbmsXD2ioFMW5djB08U",
  authDomain: "cortes-vacunos-aves.firebaseapp.com",
  projectId: "cortes-vacunos-aves",
  storageBucket: "cortes-vacunos-aves.firebasestorage.app",
  messagingSenderId: "488269451516",
  appId: "1:488269451516:web:81f33cfa808f2772370779"
};

const isConfigured = firebaseConfig.apiKey !== "TU_API_KEY";
if (!isConfigured) {
  document.getElementById('configBanner').classList.add('show');
}

let db = null;
if (isConfigured) {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
}

/* =========================================================
   2) ESTADO Y VALORES POR DEFECTO

   MODELO DE DATOS (3 pasos):
   1. "recepciones"  -> materia prima cruda que entra (ej: 21.4 kg de Lomo)
   2. "despieces"    -> de una recepción, cuántos kg de cada corte final se
                        obtuvieron (ej: de ese Lomo salieron 9kg Milanesa + 6kg Sandwich)
   3. "remitos"      -> envío de cortes ya separados a una sucursal/destino
========================================================= */
const DEFAULT_MATERIAS_PRIMAS = {
  vacuno: ["Lomo", "Carnaza", "Vacío", "Matambre"],
  pollo: ["Pechuga", "Muslo", "Ala", "Pata"]
};

const DEFAULT_CORTES = {
  vacuno: ["Corte para Milanesa", "Corte para Sandwich"],
  pollo: ["Corte para Milanesa", "Corte para Sandwich", "Corte para Grille"]
};

const DEFAULT_DESTINOS = ["Producción", "San Lorenzo", "Laureles", "Gran Santos"];

let state = {
  tab: 'vacuno',
  materiasPrimas: { vacuno: [], pollo: [] },
  cortes: { vacuno: [], pollo: [] },
  destinos: [],
  recepciones: { vacuno: [], pollo: [] },
  despieces: { vacuno: [], pollo: [] },
  remitos: { vacuno: [], pollo: [] },
  historialFiltro: 'todos' // 'todos' | 'recepcion' | 'despiece' | 'remito'
};

/* =========================================================
   3) FIRESTORE: listeners en tiempo real
========================================================= */
function initFirestore(){
  if (!db) { renderAll(); return; }

  db.collection('config').doc('materiasPrimas').onSnapshot(async (doc) => {
    if (doc.exists) {
      const data = doc.data();
      state.materiasPrimas.vacuno = data.vacuno || [];
      state.materiasPrimas.pollo = data.pollo || [];
    } else {
      await db.collection('config').doc('materiasPrimas').set(DEFAULT_MATERIAS_PRIMAS);
      state.materiasPrimas = { vacuno: [...DEFAULT_MATERIAS_PRIMAS.vacuno], pollo: [...DEFAULT_MATERIAS_PRIMAS.pollo] };
    }
    renderAll();
  }, (err) => { console.error(err); showToast('Error al leer materias primas: ' + err.message); });

  db.collection('config').doc('cortes').onSnapshot(async (doc) => {
    if (doc.exists) {
      const data = doc.data();
      state.cortes.vacuno = data.vacuno || [];
      state.cortes.pollo = data.pollo || [];
    } else {
      await db.collection('config').doc('cortes').set(DEFAULT_CORTES);
      state.cortes = { vacuno: [...DEFAULT_CORTES.vacuno], pollo: [...DEFAULT_CORTES.pollo] };
    }
    renderAll();
  }, (err) => { console.error(err); showToast('Error al leer cortes: ' + err.message); });

  db.collection('config').doc('destinos').onSnapshot(async (doc) => {
    if (doc.exists) {
      state.destinos = doc.data().lista || [];
    } else {
      await db.collection('config').doc('destinos').set({ lista: DEFAULT_DESTINOS });
      state.destinos = [...DEFAULT_DESTINOS];
    }
    renderAll();
  }, (err) => { console.error(err); showToast('Error al leer destinos: ' + err.message); });

  db.collection('recepciones').orderBy('timestamp', 'desc').onSnapshot((snap) => {
    const vacuno = [], pollo = [];
    snap.forEach((doc) => {
      const r = { id: doc.id, ...doc.data() };
      (r.producto === 'pollo' ? pollo : vacuno).push(r);
    });
    state.recepciones.vacuno = vacuno;
    state.recepciones.pollo = pollo;
    renderAll();
  }, (err) => { console.error(err); showToast('Error al leer recepciones: ' + err.message); });

  db.collection('despieces').orderBy('timestamp', 'desc').onSnapshot((snap) => {
    const vacuno = [], pollo = [];
    snap.forEach((doc) => {
      const d = { id: doc.id, ...doc.data() };
      (d.producto === 'pollo' ? pollo : vacuno).push(d);
    });
    state.despieces.vacuno = vacuno;
    state.despieces.pollo = pollo;
    renderAll();
  }, (err) => { console.error(err); showToast('Error al leer despieces: ' + err.message); });

  db.collection('remitos').orderBy('timestamp', 'desc').onSnapshot((snap) => {
    const vacuno = [], pollo = [];
    snap.forEach((doc) => {
      const r = { id: doc.id, ...doc.data() };
      (r.producto === 'pollo' ? pollo : vacuno).push(r);
    });
    state.remitos.vacuno = vacuno;
    state.remitos.pollo = pollo;
    renderAll();
  }, (err) => { console.error(err); showToast('Error al leer remitos: ' + err.message); });
}

/* =========================================================
   4) LÓGICA / CÁLCULOS DE STOCK
========================================================= */
function computeRawStock(producto){
  const recepciones = state.recepciones[producto] || [];
  const despiezos = state.despieces[producto] || [];
  const despiezoPorLote = {};
  despiezos.forEach(d => {
    const total = (d.cortes || []).reduce((s,c) => s + Number(c.kg || 0), 0);
    despiezoPorLote[d.recepcionId] = (despiezoPorLote[d.recepcionId] || 0) + total;
  });
  const porLote = recepciones.map(r => {
    const desp = despiezoPorLote[r.id] || 0;
    return { recepcion: r, despiezado: desp, disponible: Number(r.kg || 0) - desp };
  });
  const porMateriaPrima = {};
  porLote.forEach(x => {
    const nombre = x.recepcion.materiaPrima || 'Sin especificar';
    if (!porMateriaPrima[nombre]) porMateriaPrima[nombre] = { recibido: 0, despiezado: 0, disponible: 0 };
    porMateriaPrima[nombre].recibido += Number(x.recepcion.kg || 0);
    porMateriaPrima[nombre].despiezado += x.despiezado;
    porMateriaPrima[nombre].disponible += x.disponible;
  });
  return { porLote, porMateriaPrima };
}

function computeCorteStock(producto){
  const despiezos = state.despieces[producto] || [];
  const remitos = state.remitos[producto] || [];
  const totals = {};
  despiezos.forEach(d => (d.cortes || []).forEach(c => {
    totals[c.corte] = (totals[c.corte] || 0) + Number(c.kg || 0);
  }));
  remitos.forEach(r => (r.cortes || []).forEach(c => {
    totals[c.corte] = (totals[c.corte] || 0) - Number(c.kg || 0);
  }));
  return totals;
}

function fmt(n){
  return (Math.round(n * 100) / 100).toLocaleString('es-PY', { minimumFractionDigits: n % 1 === 0 ? 0 : 2 });
}
function fechaHoy(){ return new Date().toISOString().slice(0,10); }
function fechaBonita(iso){
  if (!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function tsMillis(m){
  if (m.timestamp && typeof m.timestamp.toDate === 'function') return m.timestamp.toDate().getTime();
  if (m.fecha) return new Date(m.fecha + 'T00:00:00').getTime();
  return 0;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return String(s).replace(/'/g, "\\'"); }

/* =========================================================
   5) RENDER PRINCIPAL
========================================================= */
function setTab(tab){
  state.tab = tab;
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  renderAll();
}

function renderAll(){
  const producto = state.tab;
  const label = producto === 'vacuno' ? 'Vacuno' : 'Pollo';
  const cortes = state.cortes[producto] || [];
  const materiasPrimas = state.materiasPrimas[producto] || [];

  const corteStock = computeCorteStock(producto);
  const totalCorteStock = Object.values(corteStock).reduce((s,v) => s+v, 0);
  const corteKeys = Array.from(new Set([...cortes, ...Object.keys(corteStock)]));

  const { porMateriaPrima } = computeRawStock(producto);
  const mpKeys = Array.from(new Set([...materiasPrimas, ...Object.keys(porMateriaPrima)]));

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="tabpanel ${producto}">
      <div class="scale-panel ${producto}">
        <p class="scale-label">Stock de cortes listos para despacho</p>
        <div class="scale-readout">${fmt(totalCorteStock)}<small>kg</small></div>

        <div class="corte-stock-list">
          ${corteKeys.length ? corteKeys.map(c => `
            <div class="corte-stock-row">
              <span>${escapeHtml(c)}</span>
              <span class="kg">${fmt(corteStock[c] || 0)} kg</span>
            </div>
          `).join('') : '<div class="corte-stock-row"><span>Todavía no hay cortes separados.</span></div>'}
        </div>

        <div class="actions-row">
          <button class="btn btn-entrada" onclick="openRecepcionModal()">＋ Cargar recepción</button>
          <button class="btn btn-despiece" onclick="openDespieceModal()">🔪 Despiece</button>
        </div>
        <div class="actions-row">
          <button class="btn btn-salida" onclick="openRemitoModal()">🚚 Generar remito</button>
          <button class="btn btn-reporte" onclick="openReporteModal()">📄 Reporte</button>
        </div>
      </div>

      <div class="section-title">
        Materia prima en stock (sin procesar)
        <button class="link-btn" onclick="openManageMateriasPrimasModal()">Administrar</button>
      </div>
      <div class="raw-stock-box">
        ${mpKeys.length ? mpKeys.map(nombre => {
          const d = porMateriaPrima[nombre] || { recibido:0, despiezado:0, disponible:0 };
          return `
          <div class="raw-stock-row">
            <div>
              <div class="name">${escapeHtml(nombre)}</div>
              <div class="detail">Recibido ${fmt(d.recibido)} kg · Despiezado ${fmt(d.despiezado)} kg</div>
            </div>
            <div class="kg">${fmt(d.disponible)} kg<br><span class="detail">disponible</span></div>
          </div>`;
        }).join('') : '<div class="raw-stock-row"><span class="detail">Sin materia prima cargada todavía.</span></div>'}
      </div>

      <div class="section-title">
        Cortes finales
        <button class="link-btn" onclick="openManageCortesModal()">Administrar</button>
      </div>
      <div class="chips">
        ${cortes.length ? cortes.map(c => `<span class="chip">${escapeHtml(c)}</span>`).join('') : '<span style="font-size:13px;color:var(--muted)">Sin cortes cargados todavía.</span>'}
      </div>

      <div class="section-title">
        Destinos de despacho
        <button class="link-btn" onclick="openManageDestinosModal()">Administrar</button>
      </div>
      <div class="chips">
        ${state.destinos.length ? state.destinos.map(d => `<span class="chip">${escapeHtml(d)}</span>`).join('') : '<span style="font-size:13px;color:var(--muted)">Sin destinos cargados todavía.</span>'}
      </div>

      <div class="section-title">Historial</div>
      <div class="filter-row">
        <button class="filter-btn ${state.historialFiltro==='todos'?'active':''}" onclick="setHistorialFiltro('todos')">Todo</button>
        <button class="filter-btn ${state.historialFiltro==='recepcion'?'active':''}" onclick="setHistorialFiltro('recepcion')">Recepciones</button>
        <button class="filter-btn ${state.historialFiltro==='despiece'?'active':''}" onclick="setHistorialFiltro('despiece')">Despieces</button>
        <button class="filter-btn ${state.historialFiltro==='remito'?'active':''}" onclick="setHistorialFiltro('remito')">Remitos</button>
      </div>
      ${renderHistorial(producto)}
    </div>
  `;
}

function setHistorialFiltro(f){
  state.historialFiltro = f;
  renderAll();
}

function renderHistorial(producto){
  let items = [
    ...(state.recepciones[producto] || []).map(x => ({ ...x, _kind: 'recepcion' })),
    ...(state.despieces[producto] || []).map(x => ({ ...x, _kind: 'despiece' })),
    ...(state.remitos[producto] || []).map(x => ({ ...x, _kind: 'remito' }))
  ];
  if (state.historialFiltro !== 'todos') items = items.filter(i => i._kind === state.historialFiltro);
  items.sort((a,b) => tsMillis(b) - tsMillis(a));

  if (!items.length) return '<div class="empty">Todavía no hay movimientos en esta categoría.</div>';
  return items.map(renderTicket).join('');
}

function renderTicket(item){
  if (item._kind === 'recepcion') {
    return `
      <div class="ticket">
        <div class="row1">
          <span class="tag recepcion">Recepción</span>
          <span class="kg">+${fmt(item.kg)} kg</span>
        </div>
        <div class="meta">
          <span class="corte-name">${escapeHtml(item.materiaPrima || 'Materia prima')}</span>
        </div>
        <div class="meta">
          <span>${fechaBonita(item.fecha)}${item.nota ? ' · ' + escapeHtml(item.nota) : ''}</span>
          <button class="del" onclick="deleteDoc('recepciones','${item.id}')">Eliminar</button>
        </div>
      </div>`;
  }
  if (item._kind === 'despiece') {
    const total = (item.cortes || []).reduce((s,c) => s + Number(c.kg||0), 0);
    return `
      <div class="ticket">
        <div class="row1">
          <span class="tag despiece">Despiece</span>
          <span class="kg">${fmt(total)} kg</span>
        </div>
        <div class="meta"><span>Origen: <span class="corte-name">${escapeHtml(item.materiaPrima || '')}</span></span></div>
        <div class="lines">
          ${(item.cortes || []).map(c => `<div class="line-item"><span>${escapeHtml(c.corte)}</span><span>${fmt(c.kg)} kg</span></div>`).join('')}
        </div>
        <div class="meta">
          <span>${fechaBonita(item.fecha)}${item.nota ? ' · ' + escapeHtml(item.nota) : ''}</span>
          <button class="del" onclick="deleteDoc('despieces','${item.id}')">Eliminar</button>
        </div>
      </div>`;
  }
  // remito
  const total = (item.cortes || []).reduce((s,c) => s + Number(c.kg||0), 0);
  return `
    <div class="ticket">
      <div class="row1">
        <span class="tag remito">Remito</span>
        <span class="kg">−${fmt(total)} kg</span>
      </div>
      <div class="meta"><span>Destino: <span class="corte-name">${escapeHtml(item.destino || '')}</span></span></div>
      <div class="lines">
        ${(item.cortes || []).map(c => `<div class="line-item"><span>${escapeHtml(c.corte)}</span><span>${fmt(c.kg)} kg</span></div>`).join('')}
      </div>
      <div class="meta">
        <span>${fechaBonita(item.fecha)}${item.nota ? ' · ' + escapeHtml(item.nota) : ''}</span>
        <span>
          <button class="pdf-link" onclick="regenerarRemitoPDF('${item.id}')">PDF</button>
          &nbsp;·&nbsp;
          <button class="del" onclick="deleteDoc('remitos','${item.id}')">Eliminar</button>
        </span>
      </div>
    </div>`;
}

/* =========================================================
   6) MODALES
========================================================= */
function showModal(html){
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){
  document.getElementById('overlay').classList.remove('show');
}
document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target.id === 'overlay') closeModal();
});

/* ---- 6.1 Cargar recepción (materia prima cruda) ---- */
function openRecepcionModal(){
  const producto = state.tab;
  const label = producto === 'vacuno' ? 'vacuno' : 'pollo';
  const materias = state.materiasPrimas[producto] || [];
  const options = materias.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');
  showModal(`
    <h2>Cargar recepción · ${label}</h2>
    <div class="field">
      <label>Materia prima</label>
      <select id="fRecepcionMP">
        ${options || '<option value="">Sin materias primas cargadas</option>'}
      </select>
    </div>
    <div class="field">
      <label>Kilos recibidos</label>
      <input type="number" id="fRecepcionKg" inputmode="decimal" step="0.01" min="0" placeholder="Ej: 21.4" autofocus>
    </div>
    <div class="field">
      <label>Fecha</label>
      <input type="date" id="fRecepcionFecha" value="${fechaHoy()}">
    </div>
    <div class="field">
      <label>Nota (proveedor, guía, etc.) — opcional</label>
      <input type="text" id="fRecepcionNota" placeholder="Ej: Proveedor Frigorífico X, remito 1234">
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" style="background:var(--good)" onclick="guardarRecepcion()">Guardar recepción</button>
    </div>
  `);
}

async function guardarRecepcion(){
  const materiaPrima = document.getElementById('fRecepcionMP').value;
  const kg = parseFloat(document.getElementById('fRecepcionKg').value);
  const fecha = document.getElementById('fRecepcionFecha').value || fechaHoy();
  const nota = document.getElementById('fRecepcionNota').value.trim();
  if (!materiaPrima){ showToast('Elegí una materia prima'); return; }
  if (!kg || kg <= 0){ showToast('Ingresá un valor de kg válido'); return; }
  if (!db){ showToast('Falta configurar Firebase'); return; }
  try {
    await db.collection('recepciones').add({
      producto: state.tab,
      materiaPrima,
      kg,
      fecha,
      nota,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
    closeModal();
    showToast('Recepción cargada');
  } catch (err) {
    showToast('Error: ' + err.message);
  }
}

/* ---- 6.2 Registrar despiece (materia prima -> cortes) ---- */
let despieceLineCount = 0;

function openDespieceModal(){
  const producto = state.tab;
  const label = producto === 'vacuno' ? 'vacuno' : 'pollo';
  const { porLote } = computeRawStock(producto);
  const lotesDisponibles = porLote.filter(x => x.disponible > 0.001).sort((a,b) => tsMillis(b.recepcion) - tsMillis(a.recepcion));

  const loteOptions = lotesDisponibles.map(x =>
    `<option value="${x.recepcion.id}">${escapeHtml(x.recepcion.materiaPrima)} · ${fechaBonita(x.recepcion.fecha)} · disponible ${fmt(x.disponible)} kg</option>`
  ).join('');

  despieceLineCount = 0;
  showModal(`
    <h2>Registrar despiece · ${label}</h2>
    <div class="field">
      <label>Recepción de origen</label>
      <select id="fDespieceLote">
        ${loteOptions || '<option value="">No hay materia prima disponible</option>'}
      </select>
    </div>
    <p class="lote-hint">Elegí de qué recepción de materia prima estás sacando los cortes.</p>

    <label style="display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em;">Cortes obtenidos</label>
    <div id="despieceLines"></div>
    <button type="button" class="add-line-btn" onclick="addDespieceLine()">＋ Agregar otro corte</button>

    <div class="field">
      <label>Fecha</label>
      <input type="date" id="fDespieceFecha" value="${fechaHoy()}">
    </div>
    <div class="field">
      <label>Nota — opcional</label>
      <input type="text" id="fDespieceNota" placeholder="Ej: Despiece turno mañana">
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" style="background:var(--info)" onclick="guardarDespiece()">Guardar despiece</button>
    </div>
  `);
  addDespieceLine();
}

function addDespieceLine(){
  const producto = state.tab;
  const cortes = state.cortes[producto] || [];
  const options = cortes.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  const idx = despieceLineCount++;
  const container = document.getElementById('despieceLines');
  const div = document.createElement('div');
  div.className = 'corte-line';
  div.id = 'despieceLine' + idx;
  div.innerHTML = `
    <select id="despieceCorte${idx}">${options || '<option value="">Sin cortes</option>'}</select>
    <input type="number" id="despieceKg${idx}" inputmode="decimal" step="0.01" min="0" placeholder="Kg">
    <button type="button" class="rm-line" onclick="removeLine('despieceLine${idx}')">✕</button>
  `;
  container.appendChild(div);
}

function removeLine(id){
  const el = document.getElementById(id);
  if (el) el.remove();
}

async function guardarDespiece(){
  const producto = state.tab;
  const recepcionId = document.getElementById('fDespieceLote').value;
  if (!recepcionId){ showToast('Elegí una recepción de origen'); return; }

  const { porLote } = computeRawStock(producto);
  const lote = porLote.find(x => x.recepcion.id === recepcionId);
  if (!lote){ showToast('No se encontró la recepción'); return; }

  const container = document.getElementById('despieceLines');
  const lineDivs = container.querySelectorAll('.corte-line');
  const cortesArr = [];
  for (const div of lineDivs) {
    const select = div.querySelector('select');
    const input = div.querySelector('input');
    const corte = select.value;
    const kg = parseFloat(input.value);
    if (!corte || !kg || kg <= 0) continue;
    cortesArr.push({ corte, kg });
  }
  if (!cortesArr.length){ showToast('Agregá al menos un corte con su kg'); return; }

  const totalAsignado = cortesArr.reduce((s,c) => s + c.kg, 0);
  if (totalAsignado > lote.disponible + 0.001) {
    if (!confirm(`Estás asignando ${fmt(totalAsignado)} kg pero la recepción solo tiene ${fmt(lote.disponible)} kg disponibles. ¿Confirmás igual?`)) return;
  }

  const fecha = document.getElementById('fDespieceFecha').value || fechaHoy();
  const nota = document.getElementById('fDespieceNota').value.trim();

  if (!db){ showToast('Falta configurar Firebase'); return; }
  try {
    await db.collection('despieces').add({
      producto,
      recepcionId,
      materiaPrima: lote.recepcion.materiaPrima,
      cortes: cortesArr,
      fecha,
      nota,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
    closeModal();
    showToast('Despiece registrado');
  } catch (err) {
    showToast('Error: ' + err.message);
  }
}

/* ---- 6.3 Generar remito (cortes -> destino) ---- */
let remitoLineCount = 0;

function openRemitoModal(){
  const producto = state.tab;
  const label = producto === 'vacuno' ? 'vacuno' : 'pollo';
  const destinoOptions = state.destinos.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');

  remitoLineCount = 0;
  showModal(`
    <h2>Generar remito · ${label}</h2>
    <div class="field">
      <label>Destino</label>
      <select id="fRemitoDestino">
        ${destinoOptions || '<option value="">Sin destinos cargados</option>'}
      </select>
    </div>

    <label style="display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em;">Cortes a enviar</label>
    <div id="remitoLines"></div>
    <button type="button" class="add-line-btn" onclick="addRemitoLine()">＋ Agregar otro corte</button>

    <div class="field">
      <label>Fecha</label>
      <input type="date" id="fRemitoFecha" value="${fechaHoy()}">
    </div>
    <div class="field">
      <label>Nota — opcional</label>
      <input type="text" id="fRemitoNota" placeholder="Ej: Pedido especial">
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="guardarRemito()">Guardar y generar PDF</button>
    </div>
  `);
  addRemitoLine();
}

function addRemitoLine(){
  const producto = state.tab;
  const cortes = state.cortes[producto] || [];
  const stock = computeCorteStock(producto);
  const options = cortes.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)} (${fmt(stock[c]||0)} kg disp.)</option>`).join('');
  const idx = remitoLineCount++;
  const container = document.getElementById('remitoLines');
  const div = document.createElement('div');
  div.className = 'corte-line';
  div.id = 'remitoLine' + idx;
  div.innerHTML = `
    <select id="remitoCorte${idx}">${options || '<option value="">Sin cortes</option>'}</select>
    <input type="number" id="remitoKg${idx}" inputmode="decimal" step="0.01" min="0" placeholder="Kg">
    <button type="button" class="rm-line" onclick="removeLine('remitoLine${idx}')">✕</button>
  `;
  container.appendChild(div);
}

async function guardarRemito(){
  const producto = state.tab;
  const destino = document.getElementById('fRemitoDestino').value;
  if (!destino){ showToast('Elegí un destino'); return; }

  const container = document.getElementById('remitoLines');
  const lineDivs = container.querySelectorAll('.corte-line');
  const cortesArr = [];
  for (const div of lineDivs) {
    const select = div.querySelector('select');
    const input = div.querySelector('input');
    const corte = select.value;
    const kg = parseFloat(input.value);
    if (!corte || !kg || kg <= 0) continue;
    cortesArr.push({ corte, kg });
  }
  if (!cortesArr.length){ showToast('Agregá al menos un corte con su kg'); return; }

  const stock = computeCorteStock(producto);
  const excedidos = cortesArr.filter(c => c.kg > (stock[c.corte] || 0) + 0.001);
  if (excedidos.length) {
    const detalle = excedidos.map(c => `${c.corte} (disponible: ${fmt(stock[c.corte]||0)} kg)`).join(', ');
    if (!confirm(`Esto deja stock negativo en: ${detalle}. ¿Confirmás igual?`)) return;
  }

  const fecha = document.getElementById('fRemitoFecha').value || fechaHoy();
  const nota = document.getElementById('fRemitoNota').value.trim();

  if (!db){ showToast('Falta configurar Firebase'); return; }
  try {
    const docRef = await db.collection('remitos').add({
      producto,
      destino,
      cortes: cortesArr,
      fecha,
      nota,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
    closeModal();
    showToast('Remito generado');
    buildRemitoPDF({ id: docRef.id, producto, destino, cortes: cortesArr, fecha, nota });
  } catch (err) {
    showToast('Error: ' + err.message);
  }
}

function regenerarRemitoPDF(id){
  const producto = state.tab;
  const remito = (state.remitos[producto] || []).find(r => r.id === id);
  if (!remito){ showToast('No se encontró el remito'); return; }
  buildRemitoPDF(remito);
}

/* ---- 6.4 Administrar materias primas / cortes / destinos ---- */
function openManageMateriasPrimasModal(){
  const producto = state.tab;
  const materias = state.materiasPrimas[producto] || [];
  showModal(`
    <h2>Administrar materia prima</h2>
    <div class="chips" id="manageChipsMP">
      ${materias.map(m => `<span class="chip">${escapeHtml(m)} <button onclick="eliminarMateriaPrima('${escapeAttr(m)}')">✕</button></span>`).join('') || '<span style="font-size:13px;color:var(--muted)">Sin materias primas todavía.</span>'}
    </div>
    <div class="add-corte-inline">
      <input type="text" id="fNuevaMP" placeholder="Ej: Peceto">
      <button onclick="agregarMateriaPrima()">Agregar</button>
    </div>
    <div class="modal-actions" style="margin-top:18px;">
      <button class="btn-secondary" style="flex:1" onclick="closeModal()">Listo</button>
    </div>
  `);
}

async function agregarMateriaPrima(){
  const input = document.getElementById('fNuevaMP');
  const nombre = input.value.trim();
  if (!nombre) return;
  const producto = state.tab;
  const actuales = state.materiasPrimas[producto] || [];
  if (actuales.includes(nombre)){ showToast('Esa materia prima ya existe'); return; }
  if (!db){ showToast('Falta configurar Firebase'); return; }
  try {
    await db.collection('config').doc('materiasPrimas').set({ [producto]: [...actuales, nombre] }, { merge: true });
    input.value = '';
    setTimeout(openManageMateriasPrimasModal, 150);
  } catch (err) {
    showToast('Error: ' + err.message);
  }
}

async function eliminarMateriaPrima(nombre){
  const producto = state.tab;
  const actuales = state.materiasPrimas[producto] || [];
  if (!confirm(`¿Eliminar "${nombre}"? (no borra las recepciones ya cargadas)`)) return;
  if (!db){ showToast('Falta configurar Firebase'); return; }
  try {
    await db.collection('config').doc('materiasPrimas').set({ [producto]: actuales.filter(m => m !== nombre) }, { merge: true });
    setTimeout(openManageMateriasPrimasModal, 150);
  } catch (err) {
    showToast('Error: ' + err.message);
  }
}

function openManageCortesModal(){
  const producto = state.tab;
  const label = producto === 'vacuno' ? 'vacuno' : 'pollo';
  const cortes = state.cortes[producto] || [];
  showModal(`
    <h2>Administrar cortes · ${label}</h2>
    <div class="chips" id="manageChips">
      ${cortes.map(c => `<span class="chip">${escapeHtml(c)} <button onclick="eliminarCorte('${escapeAttr(c)}')">✕</button></span>`).join('') || '<span style="font-size:13px;color:var(--muted)">Sin cortes todavía.</span>'}
    </div>
    <div class="add-corte-inline">
      <input type="text" id="fNuevoCorte" placeholder="Ej: Corte para Milanesa">
      <button onclick="agregarCorte()">Agregar</button>
    </div>
    <div class="modal-actions" style="margin-top:18px;">
      <button class="btn-secondary" style="flex:1" onclick="closeModal()">Listo</button>
    </div>
  `);
}

async function agregarCorte(){
  const input = document.getElementById('fNuevoCorte');
  const nombre = input.value.trim();
  if (!nombre) return;
  const producto = state.tab;
  const actuales = state.cortes[producto] || [];

/* ---- 6.5 Eliminar cualquier documento ---- */
async function deleteDoc(coleccion, id){

/* =========================================================
   6b) REPORTES Y REMITO EN PDF
========================================================= */
let reporteModo = 'recepcion'; // 'recepcion' | 'rango'

function openReporteModal(){
  reporteModo = 'recepcion';
  renderReporteModal();
}

function renderReporteModal(){
  const producto = state.tab;
  const label = producto === 'vacuno' ? 'Vacuno' : 'Pollo';
  const recepciones = state.recepciones[producto] || [];

  const recepcionOptions = recepciones.map(r =>
    `<option value="${r.id}">${fechaBonita(r.fecha)} · ${escapeHtml(r.materiaPrima)} · ${fmt(r.kg)} kg</option>`
  ).join('');

  showModal(`
    <h2>Generar reporte PDF · ${label}</h2>
    <div class="modal-actions" style="margin-bottom:16px;">
      <button class="btn-secondary" style="${reporteModo === 'recepcion' ? 'outline:2px solid var(--burgundy)' : ''}" onclick="reporteModo='recepcion'; renderReporteModal();">Por recepción</button>
      <button class="btn-secondary" style="${reporteModo === 'rango' ? 'outline:2px solid var(--burgundy)' : ''}" onclick="reporteModo='rango'; renderReporteModal();">Por rango de fechas</button>
    </div>

    ${reporteModo === 'recepcion' ? `
      <div class="field">
        <label>Elegí la recepción (compra)</label>
        <select id="fReporteRecepcion">
          ${recepcionOptions || '<option value="">No hay recepciones cargadas</option>'}
        </select>
      </div>
      <p style="font-size:12.5px;color:var(--muted);margin-top:-4px;">
        Muestra los cortes que se obtuvieron exactamente de esa recepción.
      </p>
    ` : `
      <div class="field">
        <label>Desde</label>
        <input type="date" id="fReporteDesde" value="${fechaHoy()}">
      </div>
      <div class="field">
        <label>Hasta</label>
        <input type="date" id="fReporteHasta" value="${fechaHoy()}">
      </div>
    `}

    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="generarReportePDF()">Generar PDF</button>
    </div>
  `);
}

function generarReportePDF(){
  const producto = state.tab;
  const label = producto === 'vacuno' ? 'Vacuno' : 'Pollo';

  if (reporteModo === 'recepcion') {
    const id = document.getElementById('fReporteRecepcion').value;
    if (!id){ showToast('Elegí una recepción'); return; }
    const recepcion = (state.recepciones[producto] || []).find(r => r.id === id);
    if (!recepcion){ showToast('No se encontró la recepción'); return; }

    const despiezosLote = (state.despieces[producto] || []).filter(d => d.recepcionId === id);
    const porCorte = {};
    despiezosLote.forEach(d => (d.cortes || []).forEach(c => {
      porCorte[c.corte] = (porCorte[c.corte] || 0) + Number(c.kg || 0);
    }));
    const totalDespiezado = Object.values(porCorte).reduce((s,v) => s+v, 0);

    buildReportePDF({
      label,
      titulo: 'Reporte de recepción',
      meta: [
        `Materia prima: ${recepcion.materiaPrima}`,
        `Fecha de recepción: ${fechaBonita(recepcion.fecha)}${recepcion.nota ? ' — ' + recepcion.nota : ''}`,
        `Kg recibido: ${fmt(recepcion.kg)} kg`,
        `Kg despiezado: ${fmt(totalDespiezado)} kg`,
        `Kg sin procesar: ${fmt(recepcion.kg - totalDespiezado)} kg`,
        `Emitido el: ${new Date().toLocaleString('es-PY')}`
      ],
      tablaTitulo: 'Kilos obtenidos por corte',
      tablaHead: ['Corte', 'Kg obtenido'],
      tablaRows: Object.entries(porCorte).map(([c,kg]) => [c, fmt(kg) + ' kg']),
      archivo: `reporte-recepcion-${producto}-${recepcion.fecha}.pdf`
    });
  } else {
    const desde = document.getElementById('fReporteDesde').value;
    const hasta = document.getElementById('fReporteHasta').value;
    if (!desde || !hasta){ showToast('Completá ambas fechas'); return; }
    const start = new Date(desde + 'T00:00:00').getTime();
    const end = new Date(hasta + 'T23:59:59').getTime();

    const recepciones = (state.recepciones[producto] || []).filter(r => tsMillis(r) >= start && tsMillis(r) <= end);
    const despiezos = (state.despieces[producto] || []).filter(d => tsMillis(d) >= start && tsMillis(d) <= end);
    const remitos = (state.remitos[producto] || []).filter(r => tsMillis(r) >= start && tsMillis(r) <= end);

    const totalRecibido = recepciones.reduce((s,r) => s + Number(r.kg||0), 0);
    const porCorteDespiezado = {};
    despiezos.forEach(d => (d.cortes||[]).forEach(c => { porCorteDespiezado[c.corte] = (porCorteDespiezado[c.corte]||0) + Number(c.kg||0); }));
    const totalDespiezado = Object.values(porCorteDespiezado).reduce((s,v)=>s+v,0);

    const porDestino = {};
    remitos.forEach(r => (r.cortes||[]).forEach(c => {
      const key = r.destino + '||' + c.corte;
      porDestino[key] = (porDestino[key]||0) + Number(c.kg||0);
    }));
    const totalEnviado = remitos.reduce((s,r) => s + (r.cortes||[]).reduce((s2,c)=>s2+Number(c.kg||0),0), 0);

    buildReportePDF({
      label,
      titulo: 'Reporte por rango de fechas',
      meta: [
        `Período: ${fechaBonita(desde)} — ${fechaBonita(hasta)}`,
        `Total recibido (materia prima): ${fmt(totalRecibido)} kg`,
        `Total despiezado: ${fmt(totalDespiezado)} kg`,
        `Total enviado a sucursales: ${fmt(totalEnviado)} kg`,
        `Emitido el: ${new Date().toLocaleString('es-PY')}`
      ],
      tablaTitulo: 'Kilos despiezados por corte',
      tablaHead: ['Corte', 'Kg despiezado'],
      tablaRows: Object.entries(porCorteDespiezado).map(([c,kg]) => [c, fmt(kg) + ' kg']),
      tabla2Titulo: 'Envíos por destino y corte',
      tabla2Head: ['Destino', 'Corte', 'Kg'],
      tabla2Rows: Object.entries(porDestino).map(([key,kg]) => { const [destino,corte] = key.split('||'); return [destino, corte, fmt(kg) + ' kg']; }),
      archivo: `reporte-rango-${producto}-${desde}-a-${hasta}.pdf`
    });
  }
}

function buildReportePDF(data){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const burgundy = [122, 46, 46];
  const mustard = [201, 154, 60];
  const ink = [36, 27, 23];
  const accent = data.label === 'Vacuno' ? burgundy : mustard;

  doc.setFillColor(...ink);
  doc.rect(0, 0, 210, 28, 'F');
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold');
  doc.setFontSize(15);
  doc.text('Control de Productos Cárnicos y Pollos', 14, 13);
  doc.setFontSize(10);
  doc.setFont('helvetica','normal');
  doc.text(`${data.titulo} · ${data.label}`, 14, 20);

  doc.setTextColor(...ink);
  let y = 38;
  doc.setFont('helvetica','normal');
  doc.setFontSize(10);
  data.meta.forEach(l => { doc.text(l, 14, y); y += 6; });
  y += 4;

  doc.setFont('helvetica','bold');
  doc.setFontSize(11);
  doc.text(data.tablaTitulo, 14, y);

  doc.autoTable({
    startY: y + 3,
    head: [data.tablaHead],
    body: data.tablaRows.length ? data.tablaRows : [['Sin datos en el período', '-']],
    headStyles: { fillColor: accent, textColor: 255 },
    styles: { fontSize: 10 },
    margin: { left: 14, right: 14 }
  });

  let finalY = doc.lastAutoTable.finalY + 10;

  if (data.tabla2Titulo) {
    doc.setFont('helvetica','bold');
    doc.setFontSize(11);
    doc.text(data.tabla2Titulo, 14, finalY);
    doc.autoTable({
      startY: finalY + 3,
      head: [data.tabla2Head],
      body: data.tabla2Rows.length ? data.tabla2Rows : [['-', '-', '-']],
      headStyles: { fillColor: ink, textColor: 255 },
      styles: { fontSize: 9.5 },
      margin: { left: 14, right: 14 }
    });
    finalY = doc.lastAutoTable.finalY + 10;
  }

  doc.setFontSize(8.5);
  doc.setTextColor(140,130,120);
  doc.text('Documento generado automáticamente por la app de Control de Productos Cárnicos y Pollos — VitaPan.', 14, finalY + 4);

  doc.save(data.archivo);
  closeModal();
  showToast('Reporte generado');
}

function buildRemitoPDF(remito){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const label = remito.producto === 'vacuno' ? 'Vacuno' : 'Pollo';
  const burgundy = [122, 46, 46];
  const mustard = [201, 154, 60];
  const ink = [36, 27, 23];
  const accent = label === 'Vacuno' ? burgundy : mustard;

  doc.setFillColor(...ink);
  doc.rect(0, 0, 210, 30, 'F');
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold');
  doc.setFontSize(16);
  doc.text('REMITO DE ENVÍO', 14, 14);
  doc.setFontSize(10);
  doc.setFont('helvetica','normal');
  doc.text('Control de Productos Cárnicos y Pollos — VitaPan', 14, 21);

  doc.setTextColor(...ink);
  let y = 40;
  doc.setFont('helvetica','bold');
  doc.setFontSize(11);
  doc.text('Datos del envío', 14, y);
  y += 7;
  doc.setFont('helvetica','normal');
  doc.setFontSize(10.5);
  doc.text(`Producto: ${label}`, 14, y); y += 6;
  doc.text(`Destino: ${remito.destino}`, 14, y); y += 6;
  doc.text(`Fecha: ${fechaBonita(remito.fecha)}`, 14, y); y += 6;
  if (remito.nota) { doc.text(`Nota: ${remito.nota}`, 14, y); y += 6; }
  y += 4;

  const rows = (remito.cortes || []).map(c => [c.corte, fmt(c.kg) + ' kg']);
  const total = (remito.cortes || []).reduce((s,c) => s + Number(c.kg||0), 0);

  doc.autoTable({
    startY: y,
    head: [['Corte', 'Kilos']],
    body: rows.length ? rows : [['-', '-']],
    foot: [['TOTAL', fmt(total) + ' kg']],
    headStyles: { fillColor: accent, textColor: 255 },
    footStyles: { fillColor: ink, textColor: 255, fontStyle: 'bold' },
    styles: { fontSize: 11 },
    margin: { left: 14, right: 14 }
  });

  const finalY = doc.lastAutoTable.finalY + 26;
  doc.setDrawColor(200,200,200);
  doc.line(14, finalY, 84, finalY);
  doc.line(126, finalY, 196, finalY);
  doc.setFontSize(9);
  doc.text('Firma entrega', 14, finalY + 5);
  doc.text('Firma recibe conforme', 126, finalY + 5);

  doc.setFontSize(8.5);
  doc.setTextColor(140,130,120);
  doc.text(`Generado el ${new Date().toLocaleString('es-PY')}`, 14, 285);

  doc.save(`remito-${remito.destino.replace(/\s+/g,'-').toLowerCase()}-${remito.fecha}.pdf`);
}

/* =========================================================
   7) TOAST
========================================================= */
let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* =========================================================
   8) PWA: registrar service worker + botón de instalar
========================================================= */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').then((reg) => {
      reg.update();
    }).catch(console.error);
  });
}

let deferredInstallPrompt = null;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  document.getElementById('installBtn').style.display = 'inline-block';
});

window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  document.getElementById('installBtn').style.display = 'none';
  showToast('App instalada');
});

async function triggerInstall(){
  if (!deferredInstallPrompt){
    showToast('Usá el menú ⋮ del navegador → "Instalar app"');
    return;
  }
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  document.getElementById('installBtn').style.display = 'none';
}
